[global]
flavor = "mkdocs"
disable = ["MD040"]

[per-file-ignores]
# GitHub Markdown allows inline HTML, which the README uses to size and center
# its header wordmark.
"README.md" = ["MD033", "MD041"]

# These files cross-reference the docs/api tree generated by mkdocstrings
# from Do doc comments, or (docs/rust-api.md) rustdoc output generated
# alongside the MkDocs site. Both use identifiers rather than real paths as
# link targets -- `[text](identifier)`, resolved by mkdocs-autorefs' inline
# extension (see docs/hooks/inline_autorefs_hook.py) rather than an actual
# file on disk -- so rumdl sees a broken relative link where there isn't
# one. The built site (`dodo mkdocs`, strict mode) is what actually checks
# these; a broken one fails that build instead of this lint.
"docs/rust-api.md" = ["MD057"]
"docs/index.md" = ["MD057"]
"docs/language/basic-types.md" = ["MD057"]
"docs/language/classes.md" = ["MD057"]
"docs/language/concurrency.md" = ["MD057"]
"docs/language/data-structures.md" = ["MD057"]
"docs/language/decorators.md" = ["MD057"]
"docs/language/error-handling.md" = ["MD057"]
"docs/language/expressions.md" = ["MD057"]
"docs/language/prelude.md" = ["MD057"]
"docs/language/strings.md" = ["MD057"]
"docs/shell/admin.md" = ["MD057"]
"docs/shell/cli-tools.md" = ["MD057"]
"docs/shell/containers.md" = ["MD057"]
"docs/shell/external-programs.md" = ["MD057"]
"docs/shell/index.md" = ["MD057"]
"docs/shell/modules.md" = ["MD057"]
"docs/shell/security.md" = ["MD057"]
"docs/shell/system-errors.md" = ["MD057"]
"docs/shell/terminal-output.md" = ["MD057"]
"docs/shell/vfs.md" = ["MD057"]
"docs/shell/wsl.md" = ["MD057"]
"docs/vm/cloud-init.md" = ["MD057"]
"docs/vm/index.md" = ["MD057"]
"docs/vm/provisioning.md" = ["MD057"]

[MD007]
indent = 4 # Unordered list indentation

[MD013]
line-length = 80
code-blocks = false
reflow = true
reflow-mode = "default"

[MD060]
enabled = true
style = "aligned"
max-width = 0
column-align = "auto"
