[package]
name = "dolang-ext-http"
version = "0.1.1"
description = "HTTP client extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
doctest = false


[features]
default = ["json"]
json = ["dep:dolang-ext-json"]


[dependencies.bstr]
workspace = true


[dependencies.bytes]
workspace = true


[dependencies.futures]
workspace = true


[dependencies.httpdate]
workspace = true


[dependencies.url]
workspace = true


[dependencies.dolang-ext-json]
workspace = true
optional = true


[dependencies.dolang-ext-url]
workspace = true


[dependencies.reqwest]
version = "0.13.1"
default-features = false
features = ["query", "stream", "native-tls", "http2", "cookies", "multipart"]


[dependencies.dolang]
workspace = true


[dependencies.dolang-ext-time]
workspace = true


[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies.tokio]
workspace = true
features = ["sync"]
