# cargo-deny policy: `dodo deny`, and the Dependencies job in CI.

[graph]
# Every target and feature, so Windows-only and optional dependencies are
# checked too.
all-features = true

[advisories]
# Unmaintained crates fail only when the workspace depends on them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # option-ext, through dirs. File-level copyleft only.
  "MPL-2.0",
  # libfuzzer-sys, only in the fuzz harness.
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
