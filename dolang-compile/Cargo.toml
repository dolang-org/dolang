[package]
name = "dolang-compile"
version = "0.1.1"
description = "Parser, resolver, and bytecode compiler for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[dependencies.phf]
workspace = true
features = ["macros"]

[dependencies.dolang-util]
workspace = true


[dependencies.dolang-bytecode]
workspace = true


[dependencies.dot-writer]
version = "0.1.4"
optional = true


[features]
default = []
debug = ["dolang-util/debug", "dolang-bytecode/debug", "dot-writer"]
