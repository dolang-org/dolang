[package]
name = "dolang"
version = "0.1.1"
description = "Embeddable public API for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = false


[target.'cfg(not(target_family = "wasm"))'.dependencies.linkme]
workspace = true

[dependencies.dolang-compile]
workspace = true


[dependencies.dolang-runtime]
workspace = true


[features]
default = []
debug = ["dolang-runtime/debug", "dolang-compile/debug"]
