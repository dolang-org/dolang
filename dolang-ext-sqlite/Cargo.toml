[package]
name = "dolang-ext-sqlite"
version = "0.1.1"
description = "SQLite extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = false
doctest = false


[dependencies.bitvec]
workspace = true


[dependencies.libc]
workspace = true


[dependencies.nix]
workspace = true
features = ["fs"]


[dependencies.libsqlite3-sys]
version = "0.38"
features = ["bundled-windows"]


[dependencies.tokio]
workspace = true
features = ["rt", "time"]

[dependencies.dolang]
workspace = true


[dependencies.dolang-ext-shell]
workspace = true


[target.'cfg(unix)'.dependencies.sqlite-plugin]
version = "0.11"

[target.'cfg(unix)'.dependencies.dolang-vfs]
workspace = true

# Not used directly: this exists only to turn `runtime` back on for the bindgen
# that `sqlite-plugin` builds with, which declares it `default-features = false`.
# Build-dependency features unify across the graph, so declaring it here is
# enough.
#
# Without `runtime`, clang-sys links libclang at build-script link time and
# emits only a link-search path — no rpath. Homebrew's libclang.dylib has an
# absolute install name so that happens to work; Xcode's is `@rpath/
# libclang.dylib`, so the build script builds and then dies in dyld. With
# `runtime`, clang-sys dlopens libclang by full path instead, and its search
# includes the `xcode-select` toolchain — no Homebrew LLVM needed.


[target.'cfg(unix)'.build-dependencies.bindgen]
version = "0.72"
default-features = false
features = ["runtime"]
