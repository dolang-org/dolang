site_name: Do Language
site_description: Documentation for the Do programming language
site_url: https://dolang-org.github.io/dolang/
repo_url: https://github.com/dolang-org/dolang

hooks:
  - docs/hooks/lexer_hook.py
  - docs/hooks/inline_autorefs_hook.py
  - docs/hooks/autorefs_title_hook.py
  - docs/hooks/playground_hook.py

plugins:
  - search
  - autorefs:
      # Several bare identifiers (e.g. a module named "json" and an unrelated
      # method also named "json") collide since mkdocstrings registers every
      # heading id workspace-wide with no namespacing. resolve_closest picks
      # the URL nearest the referring page instead of warning in strict mode.
      resolve_closest: true
  - mkdocstrings:
      default_handler: do
      handlers:
        do:
          options:
            heading_level: 2
            show_private: false
  - awesome-nav

exclude_docs: |
  /overrides/

extra_css:
  - extra.css

extra_javascript:
  - javascripts/playground.js

theme:
  name: material
  custom_dir: docs/overrides
  logo: dot.png
  favicon: dot.png
  font:
    # The playground's editor font
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra:
  generator: false

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      default_lang: dolang
  - pymdownx.superfences
