site_name: Do Language
site_description: Documentation for the Do programming language
repo_url: https://github.com/dolang-org/dolang

hooks:
  - docs/hooks/lexer_hook.py
  - docs/hooks/inline_autorefs_hook.py

plugins:
  - search
  - autorefs:
      # Several bare identifiers (e.g. a module named "json" and an unrelated
      # method also named "json") collide since mkdocstrings registers every
      # heading id workspace-wide with no namespacing. resolve_closest picks
      # the URL nearest the referring page instead of warning in strict mode.
      resolve_closest: true
  - mkdocstrings:
      default_handler: do
      handlers:
        do:
          options:
            heading_level: 2
            show_private: false
  - awesome-nav

extra_css:
  - extra.css

theme:
  name: material
  features:
    - navigation.indexes
  palette:
    scheme: slate
    primary: indigo

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      default_lang: dolang
  - pymdownx.superfences
