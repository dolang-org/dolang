[package]
name = "dolang-ext-http-mock"
version = "0.1.1"
description = "HTTP mock server extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = false
doctest = false


[features]
default = ["json"]
json = ["dep:dolang-ext-json", "dep:serde_json"]


[dependencies.bstr]
workspace = true


[dependencies.bytes]
workspace = true


[dependencies.futures]
workspace = true


[dependencies.http]
version = "1"


[dependencies.http-body-util]
version = "0.1"


[dependencies.httpdate]
workspace = true


[dependencies.hyper]
version = "1"
features = ["server", "http1", "http2"]


[dependencies.hyper-util]
version = "0.1"
features = ["server", "server-auto", "http1", "http2", "tokio"]


[dependencies.regex]
workspace = true


[dependencies.serde_json]
workspace = true
optional = true


[dependencies.url]
workspace = true

[dependencies.tokio]
workspace = true
features = ["macros", "net", "rt", "sync"]


[dependencies.dolang-ext-json]
workspace = true
optional = true


[dependencies.dolang-ext-url]
workspace = true


[dependencies.dolang-ext-time]
workspace = true


[dependencies.dolang]
workspace = true
