[package]
name = "dolang-ext-compress"
version = "0.1.1"
description = "Streaming compression extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = false
doctest = false


[features]
default = ["gzip", "zstd", "xz"]
gzip = ["async-compression/gzip"]
zstd = ["async-compression/zstd"]
xz = ["async-compression/xz"]


[dependencies.async-compression]
version = "0.4.42"
features = ["futures-io"]


[dependencies.futures-lite]
version = "2.6"
default-features = false
features = ["std"]


[dependencies.tokio]
workspace = true
features = ["io-util"]


[dependencies.tokio-util]
version = "0.7"
features = ["compat"]


[dependencies.dolang]
workspace = true


[dependencies.dolang-ext-shell]
workspace = true
