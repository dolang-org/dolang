[package]
name = "dolang-ext-tar"
version = "0.1.1"
description = "Streaming TAR archive extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = true
doctest = false


[dependencies.async-compression]
version = "0.4.42"
features = ["gzip", "tokio", "zstd"]


[dependencies.tar-framing]
version = "=0.0.17"


[dependencies.tokio]
workspace = true
features = ["io-util", "rt", "sync"]


[dependencies.tokio-util]
version = "0.7"
features = ["compat"]

[dependencies.dolang]
workspace = true


[dependencies.dolang-ext-shell]
workspace = true


[dependencies.dolang-ext-time]
workspace = true


[dependencies.dolang-util]
workspace = true
