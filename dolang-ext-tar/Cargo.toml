[package]
name = "dolang-ext-tar"
version = "0.1.1"
description = "Streaming TAR archive extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = false
doctest = false


[dependencies.async-compression]
version = "0.4.42"
features = ["gzip", "tokio", "zstd"]


[dependencies.astral-tokio-tar]
version = "0.6.4"
default-features = false


[dependencies.tokio]
workspace = true
features = ["io-util", "rt", "sync"]


[dependencies.tokio-stream]
version = "0.1"

[dependencies.dolang]
workspace = true


[dependencies.dolang-ext-shell]
workspace = true
