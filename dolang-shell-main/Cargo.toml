[package]
name = "dolang-shell-main"
version = "0.1.1"
description = "Reusable shell/interpreter core for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = false
doctest = false


[features]
default = []
debug = ["dolang/debug"]


[dependencies.blake3]
workspace = true


[dependencies.console]
workspace = true


[dependencies.crossterm]
version = "0.29.0"


[dependencies.directories]
version = "6.0.0"


[dependencies.rustyline]
version = "18.0.0"

[dependencies.tokio]
workspace = true
features = [
  "macros",
  "rt",
  "io-std",
  "io-util",
  "fs",
  "process",
  "sync",
  "signal",
]


[dependencies.dolang]
workspace = true


[dependencies.dolang-ext-shell]
workspace = true


[dependencies.dolang-ext-compile]
workspace = true


[dependencies.dolang-ext-load]
workspace = true


[target.'cfg(unix)'.dependencies.libc]
workspace = true


[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_System_Console"]
