[package]
name = "dolang-shell-modules"
version = "0.1.1"
description = "Stock embedded Do modules for the shell."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lib]
test = false
doctest = false


[build-dependencies.dolang-private-bundle]
workspace = true


[build-dependencies.dolang]
workspace = true


# The native shell's prelude for compiling `lib/`; unused under `wasm`.
[build-dependencies.dolang-ext-shell]
workspace = true


[build-dependencies.wax]
workspace = true


# Each optional extension's feature bundles its stub's typelib and the
# libraries that need it; see the table in build.rs. Extensions every consumer
# links have no feature, and those only the native shell links are bundled
# unless `wasm` is enabled.
[features]
debug = ["dolang-private-bundle/debug"]
base64 = []
compress = []
glob = []
http = []
http_mock = []
json = []
patch = []
progress = []
rand = []
regex = []
sqlite = []
tar = []
toml = []
url = []
winnet = []
winreg = []
winscm = []
xml = []
yaml = []
zip = []
# The `test` module's stub for the playground, which provides `test` natively.
wasm = []

[dependencies.dolang]
workspace = true
