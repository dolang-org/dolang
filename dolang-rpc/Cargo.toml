[package]
name = "dolang-rpc"
version = "0.1.1"
edition = "2024"
description = "Asynchronous RPC with native handle passing on Unix and Windows."
license.workspace = true
repository.workspace = true
rust-version.workspace = true


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }


[dependencies.blake3]
workspace = true


[dependencies.bytes]
workspace = true


[dependencies.dolang-util]
workspace = true


[dependencies.futures]
workspace = true


[dependencies.postcard]
workspace = true
features = ["use-std"]


[dependencies.serde]
workspace = true
features = ["derive"]


[dependencies.thiserror]
workspace = true


[dependencies.tokio]
workspace = true
features = ["io-util", "macros", "net", "rt", "sync"]


[target.'cfg(unix)'.dependencies.libc]
workspace = true


[target.'cfg(unix)'.dependencies.nix]
workspace = true
features = ["fs", "socket", "uio"]


[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"]


[target.'cfg(target_os = "macos")'.dependencies.ctor]
version = "0.2"
optional = true

[features]
default = ["macos-spawn-interpose"]
# Interposes posix_spawn/posix_spawnp on macOS to atomically close the
# SCM_RIGHTS FD_CLOEXEC race (see issue #384). Disable only if the embedding
# host process already performs its own posix_spawn interposition (e.g. a
# sanitizer or another embedded runtime) -- two interposers targeting the
# same DYLD_INTERPOSE section can conflict. Disabling this reopens the exact
# race it closes.
macos-spawn-interpose = ["dep:ctor"]
debug = ["dolang-util/debug"]


[dev-dependencies.tokio]
workspace = true
features = ["macros", "rt-multi-thread", "time"]


[dev-dependencies.criterion]
workspace = true
features = ["async_tokio"]


[target.'cfg(windows)'.dev-dependencies.windows-sys]
workspace = true
features = ["Win32_Security"]

[[bench]]
name = "pipe_trailer"
harness = false


[[bench]]
name = "pipe_raw"
harness = false
