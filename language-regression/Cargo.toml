[package]
name = "language-regression"
version = "0.1.0"
description = "Regression test suite for the core Do language"
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(asan)"] }


[lib]
test = false
doctest = false


[dependencies.dolang]
workspace = true


[dependencies.dolang-runtime]
workspace = true


[dependencies.dolang-private-test]
workspace = true


[dependencies.futures]
workspace = true


[build-dependencies.dolang-private-build]
workspace = true


[dev-dependencies.criterion]
workspace = true


[dev-dependencies.mimalloc]
workspace = true


[[bench]]
name = "typeck"
harness = false
