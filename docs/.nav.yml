# Site navigation, consumed by the awesome-nav plugin. mkdocs.yml's own
# `nav:` key is ignored once this plugin is enabled -- it replaces the whole
# site nav with what it builds from files/.nav.yml, so this is the only place
# that controls it now.

# Without this, a directory's nav title falls back to a title-cased version of
# its own name (e.g. "Fs.unix") instead of reading its index.md's frontmatter
# title, which write_doc_page in dodo.dol sets to the actual (lowercase)
# module name.
use_index_title: true

nav:
  - Home: index.md
  - Language Guide:
    - language/index.md
    - language/commands.md
    - language/expressions.md
    - language/variables.md
    - language/basic-types.md
    - language/strings.md
    - language/data-structures.md
    - language/flow-control.md
    - language/vertical-layout.md
    - language/functions.md
    - language/patterns.md
    - language/modules.md
    - language/classes.md
    - language/decorators.md
    - language/error-handling.md
    - language/concurrency.md
    - language/types.md
    - language/type-syntax.md
    - language/type-declarations.md
    - language/type-checking.md
    - language/prelude.md
  - Shell Guide:
    - shell/index.md
    - shell/external-programs.md
    - shell/terminal-output.md
    - shell/system-errors.md
    - shell/modules.md
    - shell/cli-tools.md
    - shell/vfs.md
    - shell/containers.md
    - shell/ssh.md
