[package]
name = "dolang-ext-progress"
version = "0.1.1"
description = "Progress reporting extension for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
test = false
doctest = false

# 0.18.5 and later miscount emoji presentation widths and corrupt redraws
# (#1895).
[dependencies.indicatif]
version = "=0.18.4"

[dependencies.tokio]
workspace = true
features = ["io-util"]

[dependencies.unicode-width]
workspace = true

[dependencies.dolang]
workspace = true

[dependencies.dolang-ext-shell]
workspace = true

[dependencies.dolang-ext-term]
workspace = true
