workspace = true
optional = true


[dependencies.dolang-ext-zip]
workspace = true


[dependencies.dolang-ext-tar]
workspace = true
optional = true


[dependencies.dolang-ext-compress]
workspace = true
optional = true


[dependencies.dolang-ext-sqlite]
workspace = true
optional = true


[dependencies.dolang-ext-xml]
