[package]
name = "dolang-shell"
version = "0.1.1"
description = "Stock command-line shell binary for the Do language."
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(asan)"] }


[[bin]]
name = "dolang"
path = "src/main.rs"
test = false


[features]
default = [
  "base64",
  "json",
  "regex",
  "glob",
  "http",
  "http_mock",
  "tar",
  "compress",
  "sqlite",
  "xml",
  "yaml",
  "progress",
  "rand",
  "toml",
  "patch",
  "winreg",
  "winscm",
  "winnet",
]
debug = ["dolang-shell-main/debug"]
base64 = ["dep:dolang-ext-base64", "dolang-shell-modules/base64"]
json = [
  "dep:dolang-ext-json",
  "dolang-ext-http?/json",
  "dolang-ext-http-mock?/json",
  "dolang-shell-modules/json",
]
regex = ["dep:dolang-ext-regex", "dolang-shell-modules/regex"]
glob = ["dep:dolang-ext-glob", "dolang-shell-modules/glob"]
url = ["dep:dolang-ext-url", "dolang-shell-modules/url"]
http = ["dep:dolang-ext-http", "url", "dolang-shell-modules/http"]
http_mock = ["dep:dolang-ext-http-mock", "url", "dolang-shell-modules/http_mock"]
tar = ["dep:dolang-ext-tar", "dolang-shell-modules/tar"]
compress = ["dep:dolang-ext-compress", "dolang-shell-modules/compress"]
sqlite = ["dep:dolang-ext-sqlite", "dolang-shell-modules/sqlite"]
xml = ["dep:dolang-ext-xml", "dolang-shell-modules/xml"]
yaml = ["dep:dolang-ext-yaml", "dolang-shell-modules/yaml"]
progress = ["dep:dolang-ext-progress", "dolang-shell-modules/progress"]
rand = ["dep:dolang-ext-rand", "dolang-shell-modules/rand"]
toml = ["dep:dolang-ext-toml", "dolang-shell-modules/toml"]
patch = ["dep:dolang-ext-patch", "dolang-shell-modules/patch"]
winreg = ["dep:dolang-ext-winreg", "dolang-shell-vfs/winreg", "dolang-shell-modules/winreg"]
winscm = ["dep:dolang-ext-winscm", "dolang-shell-vfs/winscm", "dolang-shell-modules/winscm"]
winnet = ["dep:dolang-ext-winnet", "dolang-shell-vfs/winnet", "dolang-shell-modules/winnet"]


[dependencies.dolang-shell-vfs]
workspace = true


[dependencies.mimalloc]
workspace = true


[dependencies.dolang-shell-main]
workspace = true


# Optional extensions forward their features.
[dependencies.dolang-shell-modules]
workspace = true


[dependencies.dolang]
workspace = true


[dependencies.dolang-ext-digest]
workspace = true


[dependencies.dolang-ext-base64]
workspace = true
optional = true


[dependencies.dolang-ext-compile]
workspace = true


[dependencies.dolang-ext-load]
workspace = true


[dependencies.dolang-ext-json]
workspace = true
optional = true


[dependencies.dolang-ext-regex]
workspace = true
optional = true


[dependencies.dolang-ext-glob]
workspace = true
optional = true


[dependencies.dolang-ext-http]
