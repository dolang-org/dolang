name: Build VSIX
description: Build, test, and package the VS Code extension

inputs:
  node-version:
    description: Node.js version to build with
    default: "24"
  upload:
    description: Upload the packaged VSIX as a workflow artifact
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: dolang-code/package-lock.json

    - name: Install extension dependencies
      shell: bash
      working-directory: dolang-code
      run: npm ci

    - name: Build extension
      shell: bash
      working-directory: dolang-code
      run: npm run compile

    - name: Run syntax tests
      shell: bash
      working-directory: dolang-code
      run: npm run test:syntax

    - name: Install session bus dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y dbus-bin dbus-daemon

    - name: Run extension tests
      shell: bash
      working-directory: dolang-code
      run: |
        # Use a private runtime directory and bus instead of the runner's session.
        XDG_RUNTIME_DIR="$(mktemp -d)"
        export XDG_RUNTIME_DIR
        trap 'rm -rf -- "$XDG_RUNTIME_DIR"' EXIT
        chmod 700 "$XDG_RUNTIME_DIR"
        dbus-run-session -- xvfb-run -a npm test

    - name: Build VSIX
      shell: bash
      working-directory: dolang-code
      run: npm run package:vsix

    - name: Upload VSIX artifact
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: dolang-vsix
        path: dolang-code/*.vsix
