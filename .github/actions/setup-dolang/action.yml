name: Setup Dolang
description: Install the pinned Dolang bootstrap release

inputs:
  version:
    description: Dolang release tag to install (defaults to .github/dolang-version)
    default: ""

outputs:
  digest:
    description: >
      Short SHA-256 of the installed release artifact. `.github/dolang-version`
      names a rolling `bootstrap` tag, so its contents identify nothing — this
      is what distinguishes one bootstrap build from the next, for cache keys
      that have to invalidate when the interpreter changes.
    value: ${{ steps.setup.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Download Dolang
      id: setup
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        DOLANG_VERSION: ${{ inputs.version }}
      run: |
        set -eu

        if [[ -z "$DOLANG_VERSION" ]]; then
          DOLANG_VERSION=$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/.github/dolang-version")
        fi

        # Archive names carry the tag without its `v`, e.g. `dolang-0.1.1-…`
        # or `dolang-bootstrap-…`.
        version="${DOLANG_VERSION#v}"

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            artifact=dolang-${version}-x86_64-linux.tar.gz
            executable=dolang
            ;;
          Linux-ARM64)
            artifact=dolang-${version}-aarch64-linux.tar.gz
            executable=dolang
            ;;
          Windows-X64)
            artifact=dolang-${version}-x86_64-windows.tar.gz
            executable=dolang.exe
            ;;
          Windows-ARM64)
            artifact=dolang-${version}-aarch64-windows.tar.gz
            executable=dolang.exe
            ;;
          macOS-ARM64)
            artifact=dolang-${version}-aarch64-macos.tar.gz
            executable=dolang
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP}/dolang-bootstrap-${DOLANG_VERSION}"
        if [[ "$RUNNER_OS" == Windows ]]; then
          shell_install_dir=$(cygpath -u "$install_dir")
        else
          shell_install_dir=$install_dir
        fi

        mkdir -p "$shell_install_dir"
        (
          cd "$shell_install_dir"
          gh release download "$DOLANG_VERSION" \
            --pattern "$artifact" \
            --dir .
          tar -xzf "$artifact"
        )
        digest=$(sha256sum "$shell_install_dir/$artifact" | cut -c1-16)
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        if [[ "$RUNNER_OS" != Windows ]]; then
          chmod +x "$install_dir/$executable"
        fi

        echo "$install_dir" >> "$GITHUB_PATH"
