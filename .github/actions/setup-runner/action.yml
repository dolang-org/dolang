name: Setup Runner
description: Provision a runner with Dolang, build prerequisites, and the dolang-ci shell wrapper

inputs:
  target:
    description: Dodo target name to build (empty means the runner's native target)
    default: ""
  dolang-version:
    description: Dolang release tag to install (defaults to .github/dolang-version)
    default: ""
  rust:
    description: Install the Rust toolchain and shared build cache
    default: "true"
  virt:
    description: Install host virtualization prerequisites on Linux
    default: "false"
  vscode:
    description: Install the packages `dodo vscode-test` needs on Linux (Xvfb and a D-Bus session)
    default: "false"
  save-cache:
    description: >
      Save updated caches for a later run to restore. Caches are scoped to the
      branch that saved them (with a fallback to the default branch), so
      saving on a branch besides the default one just spends cache storage
      that only that branch's own later runs could ever restore, evicting
      shared entries sooner. Leave this off except on the default branch (or,
      in the future, release branches).
    default: "false"

outputs:
  vm-cache-hit:
    description: >
      Whether the CI VM build cache was restored from an exact key match, in
      which case actions/cache will not save again and repacking the guest's
      caches at the end of the job would be wasted work.
    value: ${{ steps.vm-build-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install Dolang
      id: dolang
      uses: ./.github/actions/setup-dolang
      with:
        version: ${{ inputs.dolang-version }}

    - name: Install Rust toolchain
      if: inputs.rust == 'true' && inputs.target != 'x86_64-freebsd'
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      if: inputs.rust == 'true' && inputs.target != 'x86_64-freebsd'
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ inputs.save-cache == 'true' }}

    # The gold image bundle, plus the SSH key the guest trusts. Restore and
    # save are explicit steps rather than one `actions/cache@v5`: the bundle is
    # ready by the end of this action's own "Set up runner" step, so the save
    # can run immediately after it instead of waiting for a post-job hook, and
    # `save-cache` keeps the save from running at all on a branch whose cache
    # nothing but its own later runs could restore (see the input's
    # description).
    #
    # The two paths are one entry because they are a matched pair: the guest
    # trusts only the key generated for this `app`, so a bundle restored beside
    # a missing or regenerated key produces a domain that refuses the
    # connection — which surfaces as an SSH timeout, not an error naming the
    # cause. Independent entries could be evicted independently.
    #
    # The base image download cache is deliberately *not* carried any more.
    # Only the minting pass fetches it, which now happens on a recipe change
    # rather than on every cold run, and at 1.2 GB it was the largest thing
    # this repository kept in a 10 GB budget shared by every workflow.
    #
    # The interpreter's own digest is part of the key because the bundle has a
    # `dolang-vfs` baked into it, installed at mint time, and every later job
    # drives that guest binary from the runner's `dolang`. Provisioning used to
    # reinstall the payload on every run, so the two could not drift; now they
    # can. `.github/dolang-version` cannot stand in for it — it names a rolling
    # `bootstrap` tag, so its contents are the same string across every release.
    #
    # No restore-keys, and not just as a nicety: a prefix fallback would hand
    # back a bundle minted from a *different* recipe, and nothing downstream
    # would notice — the job would build against the wrong guest.
    - name: Restore CI gold image
      id: vm-gold-cache
      if: inputs.target == 'x86_64-freebsd'
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ runner.temp }}/dolang-freebsd-gold.dolvm
          ~/.local/share/dolang-freebsd-ci/libvirt/ssh
        key: freebsd-gold-v1-${{ steps.dolang.outputs.digest }}-${{ hashFiles('.github/actions/setup-runner/lib/gold.dol') }}

    # The guest's cargo/rustup/target caches, tarred out of the VM at the end
    # of the job by the workflow's own save step (see test.yml) rather than
    # here: that tarball isn't populated until the build has run, well after
    # this action returns. Only the restore half belongs here.
    #
    # Keyed on the lockfile so a dependency change repacks; restore-keys let
    # an unrelated lockfile change still start from the last good cache.
    #
    # The path is intentionally suffix-free — it is an archive whose format only
    # lib/cache.dol knows (see RUNNER_TARBALL there). Do not add one back: this
    # path and that constant must agree exactly, and a mismatch fails silently
    # as "Path(s) specified in the action for caching do(es) not exist".
    - name: Restore CI VM build cache
      id: vm-build-cache
      if: inputs.target == 'x86_64-freebsd'
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/dolang-freebsd-cache
        key: freebsd-cargo-v2-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          freebsd-cargo-v2-

    # Inputs arrive through the environment: on Windows the action path is a
    # backslash path, which would be mangled as a Do string literal
    - name: Set up runner
      shell: dolang --strict --no-cache --module-path ${{ github.action_path }}/lib {0}
      env:
        CI_SHELL: ${{ github.action_path }}/lib/shell.dol
        CI_TARGET: ${{ inputs.target }}
        CI_RUST: ${{ inputs.rust }}
        CI_VIRT: ${{ inputs.virt }}
        CI_VSCODE: ${{ inputs.vscode }}
      run: |
        import ci
        ci.setup
          shell: $env["CI_SHELL"]
          target: $env["CI_TARGET"]
          rust: (env["CI_RUST"] == "true")
          virt: (env["CI_VIRT"] == "true")
          vscode: (env["CI_VSCODE"] == "true")

    # The counterpart to "Restore CI gold image" above. Placed here, right
    # after the bundle is minted, rather than left to run automatically at the
    # end of the job: this is a plain `actions/cache/save@v5` rather than the
    # combined action's post-job hook, so it needs an explicit spot to run
    # from. Skipped on an exact restore hit for the same reason the guest build
    # cache is: nothing changed, so saving would only re-upload what is already
    # there.
    #
    # `path`/`key` are repeated from "Restore CI gold image" rather than shared
    # via a YAML anchor: GitHub's workflow parser doesn't resolve them.
    - name: Save CI gold image
      if: >
        inputs.target == 'x86_64-freebsd' && inputs.save-cache == 'true' &&
        steps.vm-gold-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ runner.temp }}/dolang-freebsd-gold.dolvm
          ~/.local/share/dolang-freebsd-ci/libvirt/ssh
        key: freebsd-gold-v1-${{ steps.dolang.outputs.digest }}-${{ hashFiles('.github/actions/setup-runner/lib/gold.dol') }}
