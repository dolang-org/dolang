name: Docs Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

defaults:
  run:
    shell: dolang-ci {0}

jobs:
  build-pages:
    name: Build Pages Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          # This workflow only ever runs on pushes to master (see `on.push`
          # above), so this is always true — spelled out for consistency with
          # the other workflows rather than hardcoding "true".
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install Wasm target
        run: |
          run rustup target add wasm32-unknown-unknown

      # The CLI has to match the locked library exactly; `dodo` uses this
      # prebuilt install instead of compiling one when the versions agree.
      - name: Find wasm-bindgen version
        id: wasm-bindgen
        shell: bash
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          run python -m pip install --requirement docs/requirements.txt
          run python -m pip install --only-binary=rumdl rumdl

      - name: Lint docs
        run: dodo.run lint-docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Lint Wasm
        run: dodo.run wasm-lint

      - name: Run Wasm tests
        run: dodo.run wasm-test

      - name: Build docs site
        run: dodo.run pages

      - name: Install browser for playground tests
        run: run npm --prefix playground exec -- playwright install --only-shell chromium

      - name: Test playground
        run: dodo.run playground-test

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    name: Deploy Pages
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
