name: Docs Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/actions/**"
      - ".github/dolang-version"
      - ".github/rustdoc-index.html"
      - ".github/workflows/docs-pages.yml"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "dodo.dol"
      - "docs/**"
      - "lib/**"
      - "mkdocs.yml"

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: true

defaults:
  run:
    shell: dolang-ci {0}

jobs:
  build-pages:
    name: Build Pages Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          # This workflow only ever runs on pushes to master (see `on.push`
          # above), so this is always true — spelled out for consistency with
          # the other workflows rather than hardcoding "true".
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: run python -m pip install --requirement docs/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build docs site
        run: dodo.run pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    name: Deploy Pages
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
